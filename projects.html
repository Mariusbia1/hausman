      <span class="site-brand-logo">HAUSMAN</span>
      <button class="mobile-nav-close" id="mobileNavClose">✕</button>
    </div>
    <nav class="mobile-fullscreen-links">
      <a href="collection.html" class="mobile-fullscreen-item" data-i18n="menu.collection">COLLECTION</a>

    <div class="projects-categories-bar" id="projectCatPills">
      <span class="project-cat-pill active" data-cat="ALL">ALL</span>

      <span class="project-cat-pill" data-cat="ARTISTS">ARTISTS</span>
      <span class="project-cat-pill" data-cat="EDITORIALS">EDITORIALS</span>
      <span class="project-cat-pill" data-cat="CAMPAIGNS">CAMPAIGNS</span>

    <!-- Editorial 4:5 Grid -->
    <div class="projects-editorial-grid" id="projectsEditorialGrid">
      <!-- Populated dynamically via app.js -->
    </div>

  <!-- SECTION 27: FOOTER -->
  <footer class="site-footer-minimal">
    <div class="container footer-inner-minimal">
      <div class="footer-top-line">
        <span data-i18n="footer.tagline">PARIS FASHION SHOWROOM — WARDROBE RENTAL</span>
        <div style="display: flex; gap: 2rem;">
          <a href="https://instagram.com/hausman.paris" target="_blank" rel="noopener" data-i18n="footer.instagram">INSTAGRAM</a>
          <a href="contact.html" data-i18n="footer.contact">CONTACT</a>

        <div style="display: flex; gap: 2rem;">
