<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — HAUSMAN Paris</title>
  <meta name="description" content="Inquiries & wardrobe loans — HAUSMAN Paris Fashion Showroom." />
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' font-family='sans-serif' font-weight='900'>H</text></svg>">
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>

  <!-- FIXED STICKY NAVIGATION BAR (Section 24) -->
  <header class="site-nav-bar">
    <div class="container site-nav-inner">
      <a href="index.html" class="site-brand-logo">HAUSMAN</a>

      <div class="site-nav-actions">
        <a href="collection.html" class="btn-nav-action" data-i18n="menu.collection">COLLECTION</a>
        <a href="projects.html" class="btn-nav-action" data-i18n="menu.projects">PROJECTS</a>
        <a href="about.html" class="btn-nav-action" data-i18n="menu.about">ABOUT</a>
      </div>

      <!-- Mobile Hamburger -->
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </header>

  <!-- MOBILE FULLSCREEN MENU -->
  <div class="mobile-nav-fullscreen" id="mobileNavFullscreen">
    <div class="mobile-nav-top">
      <span class="site-brand-logo">HAUSMAN</span>
      <button class="mobile-nav-close" id="mobileNavClose">✕</button>
    </div>
    <nav class="mobile-fullscreen-links">
      <a href="collection.html" class="mobile-fullscreen-item" data-i18n="menu.collection">COLLECTION</a>
      <a href="projects.html" class="mobile-fullscreen-item" data-i18n="menu.projects">PROJECTS</a>
      <a href="about.html" class="mobile-fullscreen-item" data-i18n="menu.about">ABOUT</a>
      <a href="contact.html" class="mobile-fullscreen-item" data-i18n="menu.contact">CONTACT</a>
    </nav>
  </div>

  <!-- MAIN CONTACT VIEW (Section 23) -->
  <main class="container">
    <div class="contact-page-layout">
      
      <h1 class="contact-title" data-i18n="contact.title">CONTACT</h1>

      <!-- Instant Confirmation Message (Section 23) -->
      <div id="contactSuccessNotice" style="display: none; padding: 1.5rem; background: var(--bg-subtle); border: 1px solid var(--border-medium); margin-bottom: 2.5rem; font-family: var(--font-heading); font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; text-align: center;" data-i18n="contact.successMsg">
        Request received. HAUSMAN will get back to you shortly.
      </div>

      <!-- Minimalist Typographic Form -->
      <form class="contact-form-minimal" id="contactFormMinimal">
        
        <div class="contact-field-group">
          <label class="contact-field-label" for="contactName" data-i18n="contact.name">NAME</label>
          <input class="contact-input-minimal" type="text" id="contactName" name="name" required />
        </div>

        <div class="contact-field-group">
          <label class="contact-field-label" for="contactEmail" data-i18n="contact.email">EMAIL / INSTAGRAM</label>
          <input class="contact-input-minimal" type="text" id="contactEmail" name="email" required />
        </div>

        <div class="contact-field-group">
          <label class="contact-field-label" for="contactProjectType" data-i18n="contact.projectType">PROJECT TYPE</label>
          <select class="contact-select-minimal" id="contactProjectType" name="projectType">
            <option value="Editorial">Editorial / Magazine</option>
            <option value="Music Video">Music Video / Film</option>
            <option value="Artist / Celebrity">Artist / Red Carpet</option>
            <option value="Brand Campaign">Brand Campaign</option>
            <option value="Creative Photography">Creative Photography</option>
            <option value="Other">Other Creative Production</option>
          </select>
        </div>

        <div class="contact-field-group">
          <label class="contact-field-label" for="contactProjectDate" data-i18n="contact.projectDate">PROJECT DATE</label>
          <input class="contact-input-minimal" type="text" id="contactProjectDate" name="projectDate" placeholder="e.g. Oct 14 — Oct 18, 2026" required />
        </div>

        <div class="contact-field-group">
          <label class="contact-field-label" for="contactRequestedPieces" data-i18n="contact.requestedPieces">REQUESTED PIECES / REFERENCES</label>
          <input class="contact-input-minimal" type="text" id="contactRequestedPieces" name="requestedPieces" placeholder="e.g. HSMN-001, HSMN-002, Rick Owens..." />
        </div>

        <div class="contact-field-group">
          <label class="contact-field-label" for="contactMessage" data-i18n="contact.message">MESSAGE</label>
          <textarea class="contact-textarea-minimal" id="contactMessage" name="message" placeholder="Brief outline of the project, moodboard notes..."></textarea>
        </div>

        <!-- Hidden honeypot anti-spam (Section 23) -->
        <input type="text" name="_website_honey" style="display: none;" tabindex="-1" autocomplete="off" />

        <button type="submit" class="btn-contact-send" data-i18n="contact.sendBtn">SEND</button>

      </form>

      <!-- Direct Showroom Contact Links (Section 23) -->
      <div class="contact-direct-links">
        <a href="mailto:contact@hausman-paris.com">EMAIL</a>
        <span>—</span>
        <a href="https://instagram.com/hausman.paris" target="_blank" rel="noopener">INSTAGRAM</a>
        <span>—</span>
        <a href="https://wa.me/33100000000" target="_blank" rel="noopener">WHATSAPP</a>
      </div>

    </div>
  </main>

  <!-- SECTION 27: FOOTER -->
  <footer class="site-footer-minimal">
    <div class="container footer-inner-minimal">
      <div class="footer-top-line">
        <span data-i18n="footer.tagline">PARIS FASHION SHOWROOM — WARDROBE RENTAL</span>
        <div style="display: flex; gap: 2rem;">
          <a href="https://instagram.com/hausman.paris" target="_blank" rel="noopener" data-i18n="footer.instagram">INSTAGRAM</a>
          <a href="contact.html" data-i18n="footer.contact">CONTACT</a>
        </div>
        <div class="lang-switch">
          <button class="lang-btn active" data-lang="en">EN</button>
          <span class="lang-sep">/</span>
          <button class="lang-btn" data-lang="fr">FR</button>
        </div>
      </div>
      <div class="footer-bottom-line">
        <span>© HAUSMAN 2026</span>
        <div style="display: flex; gap: 2rem;">
          <a href="#" data-i18n="footer.legal">LEGAL</a>
          <a href="#" data-i18n="footer.privacy">PRIVACY</a>
        </div>
        <span data-i18n="footer.location">Paris, France</span>
      </div>
    </div>
  </footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
